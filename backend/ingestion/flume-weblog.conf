# Define sources, channels and sinks
agent.sources = weblogSource
agent.channels = memoryChannel
agent.sinks = hdfsSink

# Configure the source
agent.sources.weblogSource.type = spooldir
agent.sources.weblogSource.spoolDir = /logs/incoming
agent.sources.weblogSource.fileHeader = true
agent.sources.weblogSource.basenameHeader = true

# Configure the channel
agent.channels.memoryChannel.type = memory
agent.channels.memoryChannel.capacity = 10000
agent.channels.memoryChannel.transactionCapacity = 1000

# Configure the sink
agent.sinks.hdfsSink.type = hdfs
agent.sinks.hdfsSink.hdfs.path = hdfs://namenode:9000/user/flume/logs/%Y/%m/%d
agent.sinks.hdfsSink.hdfs.fileType = DataStream
agent.sinks.hdfsSink.hdfs.filePrefix = web_logs
agent.sinks.hdfsSink.hdfs.rollInterval = 300
agent.sinks.hdfsSink.hdfs.rollSize = 134217728
agent.sinks.hdfsSink.hdfs.rollCount = 0
agent.sinks.hdfsSink.hdfs.batchSize = 1000
agent.sinks.hdfsSink.hdfs.useLocalTimeStamp = true

# Connect the source and sink to the channel
agent.sources.weblogSource.channels = memoryChannel
agent.sinks.hdfsSink.channel = memoryChannel
